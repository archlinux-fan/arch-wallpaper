<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch wallpaper generator</title>
<meta name="description" content="Make an Arch Linux wallpaper in your browser: pick a colour, shape the gradient, size the logo and download a PNG.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="logo.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Arch wallpaper</h1>
  <div id="bgSwatches" class="tags" role="group" aria-label="Background colour, Nord palette"></div>
</header>

<main><canvas id="preview" role="img" aria-label="Live preview of the wallpaper"></canvas></main>

<aside>
  <section>
    <h2>Background</h2>
    <div class="color">
      <input type="color" id="bgPick" aria-label="Pick the background colour">
      <input id="bgHex" aria-label="Background colour as hex" spellcheck="false" autocomplete="off" maxlength="7">
    </div>
  </section>

  <section>
    <h2>Gradient</h2>
    <label class="slider">Top brightness <output id="topOut"></output>
      <input type="range" id="top" min="0" max="150" step="1"></label>
    <label class="slider">Bottom brightness <output id="bottomOut"></output>
      <input type="range" id="bottom" min="0" max="150" step="1"></label>
    <p>Middle of the image: <span id="mid"></span></p>
  </section>

  <section>
    <h2>Logo</h2>
    <label class="slider">Size, % of image width <output id="sizeOut"></output>
      <input type="range" id="size" min="1" max="60" step="0.1"></label>
    <div class="color">
      <input type="color" id="logoPick" aria-label="Pick the logo colour">
      <input id="logoHex" aria-label="Logo colour as hex" spellcheck="false" autocomplete="off" maxlength="7">
    </div>
    <div id="logoSwatches" class="swatches" role="group" aria-label="Logo colour, Nord palette"></div>
    <label class="check"><input type="checkbox" id="tone"> Use a shade of the background (pressed-in look)</label>
    <label class="slider" id="shadeRow">Shade brightness <output id="shadeOut"></output>
      <input type="range" id="shade" min="20" max="150" step="1"></label>
  </section>

  <section>
    <h2>Image size</h2>
    <select id="preset" aria-label="Screen size">
      <option value="3840x2160">3840 × 2160, 4K</option>
      <option value="2560x1440">2560 × 1440, QHD</option>
      <option value="1920x1080">1920 × 1080, Full HD</option>
      <option value="3440x1440">3440 × 1440, ultrawide</option>
      <option value="5120x1440">5120 × 1440, super ultrawide</option>
      <option value="custom">Custom</option>
    </select>
    <div class="dims">
      <label>Width <input type="number" id="w" min="16" max="7680" step="1"></label>
      <label>Height <input type="number" id="h" min="16" max="7680" step="1"></label>
    </div>
    <p id="sizeHint" hidden>Use 16 to 7680 pixels.</p>
  </section>

  <section class="actions">
    <button id="download" class="primary">Download PNG</button>
    <button id="reset">Reset settings</button>
    <p id="status" role="status"></p>
  </section>

  <footer>
    <p>Runs in your browser, nothing is uploaded. <a href="https://github.com/archlinux-fan/arch-wallpaper">Source code</a></p>
    <p>The Arch Linux name and logo are trademarks of their owner. This is not an official Arch Linux project.</p>
  </footer>
</aside>
</body>
</html>
